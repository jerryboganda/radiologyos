[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "packages*"]
exclude = ["apps.web*"]

[project]
name = "radbrain"
version = "0.1.0"
description = "FCPS Radiology Brain OS"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "boto3>=1.35,<2",
  "pypdfium2>=4.30,<6",
  "pillow>=10.4,<13",
  "asyncpg>=0.29,<1",
  "celery>=5.4,<6",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyJWT[crypto]>=2.9,<3",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6.0,<7",
  "redis>=5,<6",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2",
  "mypy>=1.11,<2",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-PyYAML>=6,<7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api", "apps/worker", "packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
explicit_package_bases = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jwt", "redis", "redis.*", "uvicorn", "yaml", "boto3", "botocore.*", "pypdfium2"]
ignore_missing_imports = true
