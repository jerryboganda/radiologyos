name: radbrain

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radbrain}
      POSTGRES_USER: ${POSTGRES_USER:-radbrain_bootstrap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radbrain_bootstrap}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-radbrain_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:-radbrain_app}
      POSTGRES_MIGRATOR_USER: ${POSTGRES_MIGRATOR_USER:-radbrain_migrator}
      POSTGRES_MIGRATOR_PASSWORD: ${POSTGRES_MIGRATOR_PASSWORD:-radbrain_migrator}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  storage:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data/rustfs{0...3}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_URL: http://localhost:8080
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/realms/radbrain >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: infra/python/Dockerfile
    restart: "no"
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_MIGRATOR_URL: postgresql+asyncpg://${POSTGRES_MIGRATOR_USER:-radbrain_migrator}:${POSTGRES_MIGRATOR_PASSWORD:-radbrain_migrator}@postgres:5432/${POSTGRES_DB:-radbrain}
      APP_ENV: ${APP_ENV:-dev}
    depends_on:
      postgres:
        condition: service_healthy


  api:
    build:
      context: .
      dockerfile: infra/python/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-radbrain_app}:${POSTGRES_APP_PASSWORD:-radbrain_app}@postgres:5432/${POSTGRES_DB:-radbrain}
      APP_ENV: ${APP_ENV:-dev}
      PREVIEW_ENABLED: ${PREVIEW_ENABLED:-true}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/radbrain}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://keycloak:8080/realms/radbrain/protocol/openid-connect/certs}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-radbrain-web}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-radbrain-api}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-radbrain}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      WEB_API_SECRET: ${WEB_API_SECRET:-local-web-api-secret-change-me-32chars}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: infra/python/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_APP_USER:-radbrain_app}:${POSTGRES_APP_PASSWORD:-radbrain_app}@postgres:5432/${POSTGRES_DB:-radbrain}
      APP_ENV: ${APP_ENV:-dev}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://storage:9000
      S3_BUCKET: ${S3_BUCKET:-radbrain}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-rustfsadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-rustfsadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    command: ["celery", "-A", "apps.worker.app.celery_app:celery_app", "worker", "--beat", "--schedule=/tmp/celerybeat-schedule", "--loglevel=INFO", "--concurrency=1"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A apps.worker.app.celery_app:celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 10s
      timeout: 8s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-dev}
      PREVIEW_ENABLED: ${PREVIEW_ENABLED:-true}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-local-development-secret-change-me-32chars}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://localhost:8080/realms/radbrain}
      OIDC_INTERNAL_ISSUER: ${OIDC_INTERNAL_ISSUER:-http://keycloak:8080/realms/radbrain}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-radbrain-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-radbrain-web-secret}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      API_INTERNAL_URL: http://api:8000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8000}
      WEB_API_SECRET: ${WEB_API_SECRET:-local-web-api-secret-change-me-32chars}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  keycloak_data:
