name: Deploy production (shared platform VPS)

# Deploys radbrain to the shared platform host. Backing services (Postgres,
# Redis, MinIO) are NOT deployed here - they come from the shared `platform`
# compose project per /opt/platform/PLATFORM-RULES.md.
#
# Secrets are never passed from CI. The host reads its own root-only files:
#   /opt/platform/projects/radiologyos.env   (platform-issued credentials)
#   /opt/radiologyos/secrets.env             (radbrain migrator/app roles)
#   /opt/radiologyos/app.env                 (compose interpolation, mode 600)
# CI only needs SSH access, so it holds one secret: the deploy key.
#
# Deploys are manual only (ADR 0011): a push to main builds images but never
# deploys. The owner approves each deploy, then it is dispatched for one exact
# commit, and the job refuses unless CI and Build images both passed for it.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA on main to deploy."
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  # Short-lived token lets the host pull the private GHCR images for the
  # duration of the job; it is logged out and shredded by the deploy trap.
  packages: read

env:
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Require green CI and image build for the exact commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ inputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "sha must be a full 40-character lowercase commit SHA" >&2; exit 1
          fi
          # "identical" or "ahead" means the commit is main or an ancestor of it.
          status=$(gh api "repos/${REPO}/compare/${SHA}...main" --jq .status)
          case "$status" in
            identical|ahead) ;;
            *) echo "commit is not on main (compare status: ${status})" >&2; exit 1 ;;
          esac
          for wf in ci.yml build-images.yml; do
            ok=$(gh api "repos/${REPO}/actions/workflows/${wf}/runs?head_sha=${SHA}&status=success&per_page=1" --jq .total_count)
            if [ "$ok" -lt 1 ]; then
              echo "${wf} has no successful run for ${SHA}" >&2; exit 1
            fi
          done
          echo "CI and Build images are green for ${SHA}"

      # Check out the exact revision whose images are deployed, so the
      # compose file matches the images.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Resolve image refs
        id: refs
        env:
          tag: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          ns="${IMAGE_NAMESPACE}"
          {
            echo "tag=$tag"
            echo "python=ghcr.io/${ns}/radiologyos-python:${tag}"
            echo "web=ghcr.io/${ns}/radiologyos-web:${tag}"
            echo "embedder=ghcr.io/${ns}/radiologyos-embedder:${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Pin the host key
        # Written explicitly (LF, no BOM) so StrictHostKeyChecking can verify
        # the VPS instead of trusting whatever the runner happens to cache.
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Upload compose file
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            infra/compose/platform.yml \
            "root@${VPS_SSH_HOST}:/opt/radiologyos/platform.yml.new"

      - name: Deploy
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHON_IMAGE: ${{ steps.refs.outputs.python }}
          WEB_IMAGE: ${{ steps.refs.outputs.web }}
          EMBEDDER_IMAGE: ${{ steps.refs.outputs.embedder }}
        run: |
          set -euo pipefail
          SSH="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes root@${VPS_SSH_HOST}"

          # Hand the host a short-lived registry token over stdin, never argv.
          # It is logged out and deleted by the trap in the remote script.
          printf '%s' "$GH_TOKEN" \
            | $SSH 'umask 077; cat > /root/.ghtok; echo token-staged'

          $SSH "env GH_ACTOR=${GH_ACTOR} PYTHON_IMAGE=${PYTHON_IMAGE} WEB_IMAGE=${WEB_IMAGE} EMBEDDER_IMAGE=${EMBEDDER_IMAGE} bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/radiologyos
          cleanup() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            shred -u /root/.ghtok 2>/dev/null || rm -f /root/.ghtok
          }
          trap cleanup EXIT

          # GHCR packages are private; authenticate for the pull only.
          docker login ghcr.io -u "$GH_ACTOR" --password-stdin < /root/.ghtok >/dev/null

          # Promote the uploaded compose only after it parses. The new image
          # refs are exported so a newly required ref (e.g. the embedder on its
          # first deploy) validates before app.env is rewritten below.
          RADBRAIN_PYTHON_IMAGE="$PYTHON_IMAGE" RADBRAIN_WEB_IMAGE="$WEB_IMAGE" \
            RADBRAIN_EMBEDDER_IMAGE="$EMBEDDER_IMAGE" \
            docker compose --env-file app.env -f platform.yml.new config -q
          mv platform.yml.new platform.yml
          chmod 600 platform.yml

          # Refresh image refs only; leave credentials alone.
          sed -i "/^RADBRAIN_PYTHON_IMAGE=/d;/^RADBRAIN_WEB_IMAGE=/d;/^RADBRAIN_EMBEDDER_IMAGE=/d" app.env
          printf 'RADBRAIN_PYTHON_IMAGE=%s\nRADBRAIN_WEB_IMAGE=%s\nRADBRAIN_EMBEDDER_IMAGE=%s\n' \
            "$PYTHON_IMAGE" "$WEB_IMAGE" "$EMBEDDER_IMAGE" >> app.env

          echo "--- pull ---"
          docker compose --env-file app.env -f platform.yml pull

          echo "--- migrate (separate role, no superuser) ---"
          # -T plus </dev/null: `compose run` attaches stdin by default and this
          # script itself arrived on stdin, so it would otherwise swallow every
          # command after this line.
          docker compose --env-file app.env -f platform.yml run --rm -T migrate < /dev/null

          echo "--- up ---"
          docker compose --env-file app.env -f platform.yml up -d --remove-orphans

          echo "--- ps ---"
          docker compose --env-file app.env -f platform.yml ps
          REMOTE

      - name: Smoke check from inside the platform network
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "root@${VPS_SSH_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          echo "--- api health ---"
          # The API may still be starting after `up -d`; retry for up to 90 s.
          for attempt in $(seq 1 30); do
            if docker exec radiologyos-api-1 python -c \
              "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5); print(r.status, r.read().decode()[:200])"; then
              break
            fi
            if [ "$attempt" = 30 ]; then echo "api never became live" >&2; exit 1; fi
            sleep 3
          done
          echo "--- containers ---"
          docker ps --filter name=radiologyos- --format '{{.Names}} | {{.Status}} | {{.Ports}}'
          REMOTE
