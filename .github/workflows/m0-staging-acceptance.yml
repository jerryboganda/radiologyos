name: M0 staging acceptance

on:
  workflow_dispatch:
    inputs:
      revision:
        description: 'Exact candidate revision (40-character commit SHA)'
        required: true
        type: string
      deployment_id:
        description: 'Redacted staging deployment identifier'
        required: true
        type: string
      security_approval_reference:
        description: 'Security approval issue or review reference'
        required: true
        type: string
      release_approval_reference:
        description: 'Release approval issue or review reference'
        required: true
        type: string
      trace_review_reference:
        description: 'Redacted staging trace/metric review reference'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: m0-staging-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    name: M0 staging OIDC and authorization
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 30
    steps:
      - name: Validate dispatch metadata
        env:
          CANDIDATE_REVISION: ${{ inputs.revision }}
          DEPLOYED_REVISION: ${{ vars.RADBRAIN_STAGING_DEPLOYED_REVISION }}
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          SECURITY_APPROVAL: ${{ inputs.security_approval_reference }}
          RELEASE_APPROVAL: ${{ inputs.release_approval_reference }}
          TRACE_REVIEW: ${{ inputs.trace_review_reference }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "M0 staging acceptance must be dispatched from main" >&2
            exit 1
          fi
          test "${#CANDIDATE_REVISION}" -eq 40
          [[ "$CANDIDATE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$CANDIDATE_REVISION" = "$GITHUB_SHA"
          test "$DEPLOYED_REVISION" = "$CANDIDATE_REVISION"
          test -n "$DEPLOYMENT_ID"
          test -n "$SECURITY_APPROVAL"
          test -n "$RELEASE_APPROVAL"
          test -n "$TRACE_REVIEW"

      - name: Require green CI for the exact candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REVISION: ${{ inputs.revision }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml \
            --commit "$CANDIDATE_REVISION" --limit 1 --json conclusion --jq '.[0].conclusion')"
          test "$status" = success

      - name: Check out trusted main candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked web dependencies
        working-directory: apps/web
        run: npm ci --ignore-scripts

      - name: Typecheck staging browser harness
        working-directory: apps/web
        run: npm run typecheck:staging

      - name: Install Chromium for browser acceptance
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run M0 staging browser acceptance
        working-directory: apps/web
        env:
          RADBRAIN_STAGING_DEPLOYED_REVISION: ${{ vars.RADBRAIN_STAGING_DEPLOYED_REVISION }}
          RADBRAIN_STAGING_WEB_URL: ${{ vars.RADBRAIN_STAGING_WEB_URL }}
          RADBRAIN_STAGING_API_URL: ${{ vars.RADBRAIN_STAGING_API_URL }}
          RADBRAIN_STAGING_EXPECTED_TENANT_ID: ${{ vars.RADBRAIN_STAGING_EXPECTED_TENANT_ID }}
          RADBRAIN_STAGING_EXPECTED_ROLE: ${{ vars.RADBRAIN_STAGING_EXPECTED_ROLE }}
          RADBRAIN_STAGING_EXPECTED_SUBJECT: ${{ vars.RADBRAIN_STAGING_EXPECTED_SUBJECT }}
          RADBRAIN_STAGING_EXPECTED_USER_LABEL: ${{ vars.RADBRAIN_STAGING_EXPECTED_USER_LABEL }}
          RADBRAIN_STAGING_API_AUDIENCE: ${{ vars.RADBRAIN_STAGING_API_AUDIENCE }}
          RADBRAIN_STAGING_UNAUTHORIZED_TENANT_ID: ${{ vars.RADBRAIN_STAGING_UNAUTHORIZED_TENANT_ID }}
          RADBRAIN_STAGING_TEST_USERNAME: ${{ secrets.RADBRAIN_STAGING_TEST_USERNAME }}
          RADBRAIN_STAGING_TEST_PASSWORD: ${{ secrets.RADBRAIN_STAGING_TEST_PASSWORD }}
          RADBRAIN_STAGING_STUDENT_TOKEN: ${{ secrets.RADBRAIN_STAGING_STUDENT_TOKEN }}
          RADBRAIN_STAGING_ADMIN_TOKEN: ${{ secrets.RADBRAIN_STAGING_ADMIN_TOKEN }}
          RADBRAIN_STAGING_EXPIRED_TOKEN: ${{ secrets.RADBRAIN_STAGING_EXPIRED_TOKEN }}
          RADBRAIN_STAGING_WRONG_AUDIENCE_TOKEN: ${{ secrets.RADBRAIN_STAGING_WRONG_AUDIENCE_TOKEN }}
        run: npm run test:staging
