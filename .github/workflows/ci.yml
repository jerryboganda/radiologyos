name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Ruff
        run: python -m ruff check apps packages evals scripts
      - name: Mypy
        run: python -m mypy apps/api/app apps/worker/app
      - name: Pytest
        run: >-
          python -m pytest -q apps/api/tests
          evals/checks/test_scaffolding.py
          evals/checks/test_preview_determinism.py
          evals/checks/test_m1_library.py
          evals/checks/test_m2_knowledge.py
          evals/checks/test_m3_tutor.py
          evals/checks/test_m4_planner.py
          evals/checks/test_m5_assessment.py
          evals/checks/test_m6_ops.py
          evals/checks/test_m6_billing.py
          evals/checks/test_m6_billing_http.py
          evals/checks/test_m7_portability.py


  web:
    name: Web checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Generate OpenAPI
        run: python scripts/generate_openapi_types.py
      - name: Validate generated contract
        run: |
          test -s docs/openapi.json
          test -s apps/web/src/lib/api/generated/types.ts
          python -m json.tool docs/openapi.json >/dev/null
          git diff --exit-code -- docs/openapi.json

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install scan dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' pip-audit
      - name: Bandit
        run: python -m bandit -r apps/api/app apps/worker/app -ll
      - name: Export auditable requirements
        run: |
          python -m pip list --format=freeze | grep -v '^radbrain==' > "$RUNNER_TEMP/radbrain-requirements.txt"
          test -s "$RUNNER_TEMP/radbrain-requirements.txt"
      - name: Python dependency audit
        run: python -m pip_audit --strict --requirement "$RUNNER_TEMP/radbrain-requirements.txt"

  migrations:
    name: Migration and RLS validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Start PostgreSQL and apply migrations
        shell: bash
        run: |
          chmod +x infra/postgres/init/002_roles.sh
          docker compose up -d postgres
          until docker compose exec -T postgres pg_isready -U radbrain_bootstrap -d radbrain; do sleep 2; done
          export DATABASE_MIGRATOR_URL='postgresql+asyncpg://radbrain_migrator:radbrain_migrator@127.0.0.1:5432/radbrain'
          python -m alembic -c alembic.ini upgrade head
      - name: Run live two-tenant RLS proof
        env:
          RADBRAIN_RLS_ADMIN_DATABASE_URL: postgresql://radbrain_bootstrap:radbrain_bootstrap@127.0.0.1:5432/radbrain
          RADBRAIN_RLS_RUNTIME_DATABASE_URL: postgresql://radbrain_app:radbrain_app@127.0.0.1:5432/radbrain
        run: >-
          python -m pytest -q evals/checks/test_rls_live.py evals/checks/test_library_live.py
          evals/checks/test_knowledge_live.py evals/checks/test_knowledge_pipeline_live.py
      - name: Stop PostgreSQL
        if: always()
        run: docker compose down -v

  runtime-compose:
    name: Full runtime Compose
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Start the full M0 stack
        shell: bash
        run: |
          docker compose up -d --build
          until curl -fsS http://127.0.0.1:8000/health/live >/dev/null; do sleep 5; done
          web_ready=false
          for attempt in {1..24}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              web_ready=true
              break
            fi
            sleep 5
          done
          if [ "$web_ready" != true ]; then
            docker compose ps -a
            docker compose logs --no-color --tail=200 web
            exit 1
          fi
          worker_ready=false
          for attempt in {1..24}; do
            worker_ping="$(docker compose exec -T worker \
              celery -A apps.worker.app.celery_app:celery_app inspect ping --timeout=5 2>&1 || true)"
            echo "$worker_ping"
            if grep -q pong <<<"$worker_ping"; then
              worker_ready=true
              break
            fi
            sleep 5
          done
          if [ "$worker_ready" != true ]; then
            docker compose ps -a
            docker compose logs --no-color --tail=200 worker
            exit 1
          fi
      - name: Show redacted service status
        run: docker compose ps
      - name: Stop the full stack
        if: always()
        run: docker compose down -v

  compose:
    name: Compose validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate development Compose
        run: docker compose config --quiet
      - name: Validate production override
        env:
          RADBRAIN_MIGRATOR_IMAGE: ghcr.io/example/radbrain-migrator:sha-ci
          RADBRAIN_API_IMAGE: ghcr.io/example/radbrain-api:sha-ci
          RADBRAIN_WORKER_IMAGE: ghcr.io/example/radbrain-worker:sha-ci
          RADBRAIN_STORAGE_IMAGE: rustfs/rustfs:1.0.0
          RADBRAIN_WEB_IMAGE: ghcr.io/example/radbrain-web:sha-ci
        run: docker compose -f docker-compose.yml -f infra/compose/production.yml config --quiet
