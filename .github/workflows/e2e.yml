name: E2E

# Browser study flow against the full Compose stack with a real Keycloak sign-in.
# Synthetic data only; no model or embedding credentials exist in this job, so no
# model call can run. No artifacts are uploaded: traces, screenshots, and video
# stay off (ADR 0005).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  study-flow:
    name: Browser study flow (Compose + Keycloak)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ''
      VOYAGE_API_KEY: ''
      RADBRAIN_E2E_WEB_URL: http://localhost:3000
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Generate synthetic credentials
        shell: bash
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          {
            echo "E2E_USERNAME=e2e-$(openssl rand -hex 6)"
            echo "E2E_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Start the full stack
        shell: bash
        run: |
          docker compose up -d --build
          wait_for() {
            local name="$1" url="$2"
            for attempt in {1..60}; do
              if curl -fsS "$url" >/dev/null; then return 0; fi
              sleep 5
            done
            echo "$name did not become ready" >&2
            docker compose ps -a
            return 1
          }
          wait_for api http://127.0.0.1:8000/health/live
          wait_for web http://127.0.0.1:3000/api/health
          wait_for keycloak http://localhost:8080/realms/radbrain
          for attempt in {1..24}; do
            worker_ping="$(docker compose exec -T worker \
              celery -A apps.worker.app.celery_app:celery_app inspect ping --timeout=5 2>&1 || true)"
            if grep -q pong <<<"$worker_ping"; then exit 0; fi
            sleep 5
          done
          echo "worker did not answer a ping" >&2
          docker compose ps -a
          exit 1
      - name: Seed the synthetic identity and membership
        shell: bash
        run: bash infra/ops/e2e-seed.sh
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Install Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run the study flow
        working-directory: apps/web
        env:
          RADBRAIN_E2E_USERNAME: ${{ env.E2E_USERNAME }}
          RADBRAIN_E2E_PASSWORD: ${{ env.E2E_PASSWORD }}
        run: npm run test:e2e
      - name: Show service status and recent logs
        if: failure()
        shell: bash
        run: |
          docker compose ps -a
          for service in web api worker keycloak; do
            echo "::group::$service"
            docker compose logs --no-color --tail=150 "$service"
            echo "::endgroup::"
          done
      - name: Stop the stack
        if: always()
        run: docker compose down -v
