name: Verify production identity

# Runs the full OIDC authorization-code flow against the deployed stack after
# every deploy, then proves the API accepts a genuine token and refuses forged
# or missing ones. The script is the same one an operator can run by hand.
#
# Credentials never leave the host: the probe runs inside the platform network
# and reads the root-only keycloak directory mounted read-only.

on:
  workflow_run:
    workflows: ["Deploy production (shared platform VPS)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-production-identity
  cancel-in-progress: true

jobs:
  oidc:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Pin the host key
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts

      - name: Run the OIDC flow against the deployed realm and API
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            infra/ops/verify-oidc.py "root@${VPS_SSH_HOST}:/opt/radiologyos/verify-oidc.py"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "root@${VPS_SSH_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          KCIMG=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep radiologyos-python | head -1)
          test -n "$KCIMG"
          docker run --rm --network platform \
            -v /opt/radiologyos/verify-oidc.py:/run/verify.py:ro \
            -v /opt/radiologyos/keycloak:/run/kc:ro \
            --cpus 1 --memory 512m --pids-limit 256 \
            --entrypoint python "$KCIMG" /run/verify.py \
            --issuer http://keycloak:8080/realms/radbrain \
            --api http://radbrain-api:8000 \
            --client-id radbrain-web \
            --client-secret-file /run/kc/keycloak.env \
            --bootstrap-file /run/kc/bootstrap.env
          REMOTE

      - name: Confirm the preview surface is authentication-gated
        env:
          VPS_SSH_HOST: ${{ secrets.VPS_SSH_HOST }}
        run: |
          set -euo pipefail
          scp -o BatchMode=yes -o StrictHostKeyChecking=yes \
            infra/ops/check-preview-gated.py "root@${VPS_SSH_HOST}:/opt/radiologyos/check-preview-gated.py"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "root@${VPS_SSH_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          KCIMG=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep radiologyos-python | head -1)
          test -n "$KCIMG"
          docker run --rm --network platform \
            -v /opt/radiologyos/check-preview-gated.py:/run/check.py:ro \
            --cpus 1 --memory 256m --pids-limit 128 \
            --entrypoint python "$KCIMG" /run/check.py http://radbrain-api:8000
          REMOTE
