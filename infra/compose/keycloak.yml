name: radbrain-keycloak

# Keycloak is the identity provider (ADR 0009). It is an application, not a
# backing service: its database is its own logical database on the shared
# platform Postgres, obtained through bin/provision-project.sh.
#
# Ingress is a path prefix on the main hostname (https://radiologyos.polytronx.com/auth)
# so only one nginx-proxy-manager host and one certificate are needed. The proxy
# (infra/proxy/radiologyos-manual.conf) maps /auth/realms and /auth/resources to
# this container and never routes the admin console or the master realm.
#
# Rule 4: every service sets cpus and mem_limit.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    restart: unless-stopped
    command:
      - start
      - --http-enabled=true
      - --http-port=8080
      - --import-realm
      - --optimized=false
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://platform-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?required}
      # The issuer is pinned to the public URL. Backchannel requests from the
      # platform network (token exchange, JWKS) keep using the internal address.
      KC_HOSTNAME: ${KC_HOSTNAME:-https://radiologyos.polytronx.com/auth}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_CACHE: local
      # No explicit -XX:+UseSerialGC: the base image already selects a
      # collector and adding a second one aborts the JVM at startup.
      JAVA_OPTS_APPEND: "-XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError"
    volumes:
      - /opt/radiologyos/keycloak/realm.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          head -1 <&3 | grep -q '200'
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 60s
    networks: [platform, ingress]
    cpus: "1.0"
    mem_limit: 768m
    security_opt:
      - no-new-privileges:true

networks:
  platform:
    external: true
  ingress:
    external: true
    name: nginx-proxy-manager_default
