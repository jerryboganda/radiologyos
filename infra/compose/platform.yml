# radbrain on the shared VPS platform (185.252.233.186).
#
# Backing services (Postgres, Redis, MinIO) come from the shared `platform`
# compose project per /opt/platform/PLATFORM-RULES.md rule 1. This file starts
# no database, cache, or object store of its own.
#
# Rules honoured:
#   3. join external network `platform`; web ingress joins
#      `nginx-proxy-manager_default`; NO port is published on 0.0.0.0.
#   4. every service sets cpus + mem_limit.
#   5. per-project credentials come from /opt/platform/projects/radiologyos.env
#      and /opt/radiologyos/secrets.env, injected via app.env (mode 600).
#
# Deploy: docker compose --env-file app.env -f platform.yml up -d
name: radiologyos

x-restricted: &restricted
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:
  migrate:
    <<: *restricted
    image: ${RADBRAIN_PYTHON_IMAGE:?RADBRAIN_PYTHON_IMAGE is required}
    restart: "no"
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    environment:
      DATABASE_MIGRATOR_URL: ${DATABASE_MIGRATOR_URL:?required}
      APP_ENV: ${APP_ENV:-production}
    networks: [default, platform]
    cpus: "1.0"
    mem_limit: 512m

  api:
    <<: *restricted
    image: ${RADBRAIN_PYTHON_IMAGE:?RADBRAIN_PYTHON_IMAGE is required}
    command: ["uvicorn", "apps.api.app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      APP_ENV: ${APP_ENV:-production}
      REDIS_URL: ${REDIS_URL:?required}
      S3_ENDPOINT: ${S3_ENDPOINT:?required}
      S3_BUCKET: ${S3_BUCKET:?required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
      S3_REGION: ${S3_REGION:-us-east-1}
      WEB_API_SECRET: ${WEB_API_SECRET:-}
      # The API is not on the ingress network; tutor and question generation
      # call the model in-process (ADR 0012 addendum).
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-radbrain-api}
      CORE_TENANT_ID: ${CORE_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      MODELS_CONFIG_PATH: ${MODELS_CONFIG_PATH:-packages/models/models.yaml}
      ALLOW_UNGROUNDED_DEFAULT: "false"
      # Local voyage-4-nano (ADR 0019). No depends_on: if it is down, search
      # degrades to lexical instead of blocking the API.
      EMBEDDER_URL: http://radbrain-embedder:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      default:
      platform:
        # Stable internal name, so health probes and verification jobs address
        # the service rather than a container id.
        aliases: [radbrain-api]
    cpus: "1.0"
    mem_limit: 1g

  worker:
    <<: *restricted
    image: ${RADBRAIN_PYTHON_IMAGE:?RADBRAIN_PYTHON_IMAGE is required}
    command: ["celery", "-A", "apps.worker.app.celery_app:celery_app", "worker", "--beat", "--schedule=/tmp/celerybeat-schedule", "--loglevel=INFO", "--concurrency=2"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      APP_ENV: ${APP_ENV:-production}
      REDIS_URL: ${REDIS_URL:?required}
      S3_ENDPOINT: ${S3_ENDPOINT:?required}
      S3_BUCKET: ${S3_BUCKET:?required}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
      S3_REGION: ${S3_REGION:-us-east-1}
      # ADR 0010: the owner's subscription token and the Voyage key; worker only.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      CORE_TENANT_ID: ${CORE_TENANT_ID:-00000000-0000-0000-0000-000000000001}
      MODELS_CONFIG_PATH: ${MODELS_CONFIG_PATH:-packages/models/models.yaml}
    healthcheck:
      test: ["CMD-SHELL", "celery -A apps.worker.app.celery_app:celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks: [default, platform]
    cpus: "2.0"
    mem_limit: 3g

  embedder:
    # Switched off by the owner (2026-09-26): all embeddings use voyage-4-large
    # inside the free quota (ADR 0019). Kept for later; start it with
    # `--profile embedder` and set models.yaml query.backend back to local.
    profiles: [embedder]
    <<: *restricted
    image: ${RADBRAIN_EMBEDDER_IMAGE:?RADBRAIN_EMBEDDER_IMAGE is required}
    environment:
      EMBEDDER_THREADS: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      # Project network only, under a unique alias: bare names collide with
      # other projects on `platform`/ingress (see API_INTERNAL_URL below).
      default:
        aliases: [radbrain-embedder]
    cpus: "2.0"
    mem_limit: 3g

  web:
    <<: *restricted
    image: ${RADBRAIN_WEB_IMAGE:?RADBRAIN_WEB_IMAGE is required}
    environment:
      APP_ENV: ${APP_ENV:-production}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:?required}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://radiologyos.polytronx.com}
      # adapter-node derives url.origin (CSRF check, cookie Secure flag) from ORIGIN.
      ORIGIN: ${PUBLIC_ORIGIN:-https://radiologyos.polytronx.com}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Unique alias: bare names like "api" collide with other projects on the
      # shared networks (the login callback once reached another app's "api").
      API_INTERNAL_URL: http://radbrain-api:8000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://radiologyos.polytronx.com}
      WEB_API_SECRET: ${WEB_API_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_INTERNAL_ISSUER: ${OIDC_INTERNAL_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 25s
    networks:
      default:
      platform:
      # nginx-proxy-manager forwards the public domain to this alias.
      ingress:
        aliases: [radbrain-web]
    cpus: "0.5"
    mem_limit: 384m

networks:
  platform:
    external: true
  ingress:
    external: true
    name: nginx-proxy-manager_default
