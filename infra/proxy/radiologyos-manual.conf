# radiologyos.polytronx.com - managed by the radiologyos repo
# (infra/proxy/radiologyos-manual.conf, docs/runbooks/production-deploy.md),
# not by the NPM database. Keycloak is served under /auth (ADR 0009); its admin
# console is deliberately not routed.
server {
  listen 80;
  listen [::]:80;
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name radiologyos.polytronx.com;
  http2 on;

  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/radiologyos.polytronx.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/radiologyos.polytronx.com/privkey.pem;
  include conf.d/include/block-exploits.conf;

  if ($scheme = http) { return 301 https://$host$request_uri; }

  client_max_body_size 512m;
  proxy_read_timeout 300s;
  access_log /data/logs/proxy-host-radiologyos_access.log proxy;
  error_log /data/logs/proxy-host-radiologyos_error.log warn;

  # The master (administration) realm is never public.
  location ^~ /auth/realms/master { return 404; }

  location ^~ /auth/realms/ {
    proxy_pass http://radbrain-keycloak-keycloak-1:8080/realms/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
  }

  location ^~ /auth/resources/ {
    proxy_pass http://radbrain-keycloak-keycloak-1:8080/resources/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
  }

  location / {
    proxy_pass http://radbrain-web:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
