schema_version: 1
config_version: adr-0010-v1
# ADR 0010: every route runs on Claude Opus 5.5 through the owner's Claude
# subscription via Claude Code headless; embeddings use Voyage AI. Concrete
# names and effort live only here, never in application code.
provider_gate:
  status: approved
  approved_by_adr: docs/decisions/0010-claude-subscription-model-routes.md
  external_egress_allowed: true
default_backend: claude_code
allow_ungrounded_default: false
routes:
  reason:
    targets:
      - backend: claude_code
        model: claude-opus-5-5
        effort: high
    fallbacks: []
    timeout_ms: 600000
    max_retries: 2
  extract:
    targets:
      - backend: claude_code
        model: claude-opus-5-5
        effort: high
    fallbacks: []
    timeout_ms: 600000
    max_retries: 2
  classify:
    targets:
      - backend: claude_code
        model: claude-opus-5-5
        effort: high
    fallbacks: []
    timeout_ms: 300000
    max_retries: 2
  vision:
    targets:
      - backend: claude_code
        model: claude-opus-5-5
        effort: high
    fallbacks: []
    timeout_ms: 600000
    max_retries: 2
# OWNER MODEL RULES (mission critical, 2026-09-26; ADR 0035). Supersedes ADR 0033.
# - Pages and figures: GPT-6 Luna high -> GPT-6 Sol high -> PAUSE for the owner's
#   OK -> Claude Opus 5.5 high (requires_owner_approval; nothing is sent without it).
# - Knowledge extraction, claims, topic tags: GPT-6 Luna at max effort, Fast tier.
# - Everything the owner uses directly: Claude Opus 5.5 at medium.
# - Opus 5.5 at high is never used except as the owner-approved last resort.
agents:
  page_parse:
    targets:
      - {backend: codex, model: gpt-6-luna, effort: high}
      - {backend: codex, model: gpt-6-sol, effort: high}
      - {backend: claude_code, model: claude-opus-5-5, effort: high, requires_owner_approval: true}
  image_case:
    targets:
      - {backend: codex, model: gpt-6-luna, effort: high}
      - {backend: codex, model: gpt-6-sol, effort: high}
      - {backend: claude_code, model: claude-opus-5-5, effort: high, requires_owner_approval: true}
  knowledge_extract:
    targets:
      - {backend: codex, model: gpt-6-luna, effort: max, speed: fast}
  topic_classify:
    targets:
      - {backend: codex, model: gpt-6-luna, effort: max, speed: fast}
  paper_topics:
    targets:
      - {backend: codex, model: gpt-6-luna, effort: max, speed: fast}
  concept_synthesis:
    targets:
      - {backend: codex, model: gpt-6-luna, effort: max, speed: fast}
  concept_resolver:
    targets:
      - {backend: codex, model: gpt-6-luna, effort: max, speed: fast}
  claim_conflict:
    targets:
      - {backend: codex, model: gpt-6-luna, effort: max, speed: fast}
  tutor_answer:
    targets:
      - {backend: claude_code, model: claude-opus-5-5, effort: medium}
  tutor_web:
    targets:
      - {backend: claude_code, model: claude-opus-5-5, effort: medium}
  tutor_memory:
    targets:
      - {backend: claude_code, model: claude-opus-5-5, effort: medium}
  grounding_judge:
    targets:
      - {backend: claude_code, model: claude-opus-5-5, effort: medium}
  question_generate:
    targets:
      - {backend: claude_code, model: claude-opus-5-5, effort: medium}
  question_check:
    targets:
      - {backend: claude_code, model: claude-opus-5-5, effort: medium}
  seq_grade:
    targets:
      - {backend: claude_code, model: claude-opus-5-5, effort: medium}
  card_generate:
    targets:
      - {backend: claude_code, model: claude-opus-5-5, effort: medium}
  viva_open:
    targets:
      - {backend: claude_code, model: claude-opus-5-5, effort: medium}
  viva_examiner:
    targets:
      - {backend: claude_code, model: claude-opus-5-5, effort: medium}
  image_case_stages:
    targets:
      - {backend: claude_code, model: claude-opus-5-5, effort: medium}
# ADR 0019 (owner override 2026-09-26): everything uses the paid best model,
# voyage-4-large, inside the 200M free tokens. Every call (documents, figures,
# queries, question stems) is metered; Voyage calls stop hard at 195M lifetime
# tokens and the admin gets a red alert. The local voyage-4-nano embedder is
# kept but switched off (set query.backend: local to use it again).
embeddings:
  dimensions: 1024
  document:
    backend: voyage
    model: voyage-4-large
    api_key_env: VOYAGE_API_KEY
    base_url: https://api.voyageai.com/v1
  query:
    backend: voyage
    model: voyage-4-large
    api_key_env: VOYAGE_API_KEY
    base_url: https://api.voyageai.com/v1
  budget:
    hard_cap_tokens: 195000000
    warn_tokens: 150000000
# ADR 0028 (owner-approved 2026-09-26): Voyage rerank-2.5 reorders the fused
# (RRF) hits of library search, tutor and question retrieval. Its 200M free
# tokens are separate from the embedding models', so it has its own lifetime
# cap. Past the cap, or when Voyage is unavailable, results keep RRF order.
rerank:
  backend: voyage
  model: rerank-2.5
  api_key_env: VOYAGE_API_KEY
  base_url: https://api.voyageai.com/v1
  top_k: 8
  candidates: 24
  min_score: 0.2
  budget:
    hard_cap_tokens: 195000000
    warn_tokens: 150000000
