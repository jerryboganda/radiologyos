schema_version: 1
config_version: adr-0010-v1
# ADR 0010: every route runs on Claude Opus 5.5 through the owner's Claude
# subscription via Claude Code headless; embeddings use Voyage AI. Concrete
# names and effort live only here, never in application code.
provider_gate:
  status: approved
  approved_by_adr: docs/decisions/0010-claude-subscription-model-routes.md
  external_egress_allowed: true
default_backend: claude_code
allow_ungrounded_default: false
routes:
  reason:
    targets:
      - backend: claude_code
        model: claude-opus-5-5
        effort: high
    fallbacks: []
    timeout_ms: 600000
    max_retries: 2
  extract:
    targets:
      - backend: claude_code
        model: claude-opus-5-5
        effort: high
    fallbacks: []
    timeout_ms: 600000
    max_retries: 2
  classify:
    targets:
      - backend: claude_code
        model: claude-opus-5-5
        effort: high
    fallbacks: []
    timeout_ms: 300000
    max_retries: 2
  vision:
    targets:
      - backend: claude_code
        model: claude-opus-5-5
        effort: high
    fallbacks: []
    timeout_ms: 600000
    max_retries: 2
# ADR 0019: documents and figures are embedded once via the Voyage API
# (voyage-4-large, inside the 200M free tokens); every query is embedded free
# on our own server with the open-weight voyage-4-nano (same embedding space).
# Voyage calls stop hard at 195M lifetime tokens and the admin gets a red alert.
embeddings:
  dimensions: 1024
  document:
    backend: voyage
    model: voyage-4-large
    api_key_env: VOYAGE_API_KEY
    base_url: https://api.voyageai.com/v1
  query:
    backend: local
    model: voyage-4-nano
    base_url: http://radbrain-embedder:8080
  budget:
    hard_cap_tokens: 195000000
    warn_tokens: 150000000
