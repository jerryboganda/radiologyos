schema_version: 1
config_version: adr-0010-v1
# ADR 0010: every route runs on Claude Opus 5.5 through the owner's Claude
# subscription via Claude Code headless; embeddings use Voyage AI. Concrete
# names and effort live only here, never in application code.
provider_gate:
  status: approved
  approved_by_adr: docs/decisions/0010-claude-subscription-model-routes.md
  external_egress_allowed: true
default_backend: claude_code
allow_ungrounded_default: false
routes:
  reason:
    targets:
      - backend: claude_code
        model: claude-opus-5-5
        effort: high
    fallbacks: []
    timeout_ms: 600000
    max_retries: 2
  extract:
    targets:
      - backend: claude_code
        model: claude-opus-5-5
        effort: high
    fallbacks: []
    timeout_ms: 600000
    max_retries: 2
  classify:
    targets:
      - backend: claude_code
        model: claude-opus-5-5
        effort: high
    fallbacks: []
    timeout_ms: 300000
    max_retries: 2
  vision:
    targets:
      - backend: claude_code
        model: claude-opus-5-5
        effort: high
    fallbacks: []
    timeout_ms: 600000
    max_retries: 2
# ADR 0033 (owner decision 2026-09-26): pages are read by Claude Sonnet 5 at
# high effort (same text, figures and boxes as Opus 5.5 low on a 5-page test at
# about 55% of the usage); a page failing the quality gates (ADR 0027) is
# redone by Opus 5.5 at medium effort. Mistral is not used.
agents:
  page_parse:
    targets:
      - {backend: claude_code, model: claude-sonnet-5, effort: high}
      - {backend: claude_code, model: claude-opus-5-5, effort: medium}
# ADR 0019 (owner override 2026-09-26): everything uses the paid best model,
# voyage-4-large, inside the 200M free tokens. Every call (documents, figures,
# queries, question stems) is metered; Voyage calls stop hard at 195M lifetime
# tokens and the admin gets a red alert. The local voyage-4-nano embedder is
# kept but switched off (set query.backend: local to use it again).
embeddings:
  dimensions: 1024
  document:
    backend: voyage
    model: voyage-4-large
    api_key_env: VOYAGE_API_KEY
    base_url: https://api.voyageai.com/v1
  query:
    backend: voyage
    model: voyage-4-large
    api_key_env: VOYAGE_API_KEY
    base_url: https://api.voyageai.com/v1
  budget:
    hard_cap_tokens: 195000000
    warn_tokens: 150000000
# ADR 0028 (owner-approved 2026-09-26): Voyage rerank-2.5 reorders the fused
# (RRF) hits of library search, tutor and question retrieval. Its 200M free
# tokens are separate from the embedding models', so it has its own lifetime
# cap. Past the cap, or when Voyage is unavailable, results keep RRF order.
rerank:
  backend: voyage
  model: rerank-2.5
  api_key_env: VOYAGE_API_KEY
  base_url: https://api.voyageai.com/v1
  top_k: 8
  candidates: 24
  min_score: 0.2
  budget:
    hard_cap_tokens: 195000000
    warn_tokens: 150000000
